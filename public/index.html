<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction History</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    form label { display: flex; flex-direction: column; font-size: .8rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
    td.amount { text-align: right; }
    .neg { color: #b00020; } .pos { color: #087f23; }
    #status { padding: 1rem; color: #555; } #status.error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Transaction History</h1>
  <form id="filters">
    <label>Search <input type="search" id="search" placeholder="Description"></label>
    <label>From <input type="date" id="startDate"></label>
    <label>To <input type="date" id="endDate"></label>
    <label>Category <select id="category"><option value="">All</option></select></label>
    <button type="button" id="clear">Clear filters</button>
  </form>
  <div id="status" role="status" hidden></div>
  <table id="table" hidden>
    <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script type="module" src="app.js"></script>
</body>
</html>
